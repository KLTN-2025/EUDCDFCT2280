plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

// 🟢 1. ĐOẠN CODE MỚI: Đọc thông tin từ key.properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.ecolive.converter"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true 
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.ecolive.converter"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    // 🟢 2. ĐOẠN CODE MỚI: Cấu hình chữ ký số (Signing)
    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // 🟢 3. ÁP DỤNG: Dùng cấu hình release vừa tạo ở trên (thay vì debug)
            signingConfig signingConfigs.release
            
            // Tối ưu hóa (Giữ nguyên false để tránh lỗi lúc này)
            minifyEnabled false 
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation "com.tom-roush:pdfbox-android:2.0.25.0"
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.tom_roush" && details.requested.name == "pdfbox-android") {
            details.useTarget("com.tom-roush:pdfbox-android:2.0.25.0")
        }
    }
}