name: ecolive
description: "Professional Font, Image & Language Converter for Word/PDF documents."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.4
  smooth_page_indicator:
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^5.0.7
  firebase_app_check: ^0.3.2+4
  flutter_rating_bar: ^4.0.1
  sleek_circular_slider: ^2.0.1
  get_it: ^7.6.0
  cached_network_image: ^3.2.3
  flutter_launcher_icons: ^0.14.3
  vibration: ^3.1.3
  pdf: ^3.10.1
  docx_template: ^0.4.0
  flutter_lints: ^2.0.0
  curved_navigation_bar: ^1.0.6
  google_generative_ai: ^0.4.6
  intl: ^0.20.2
  internet_connection_checker_plus: ^2.7.1
  provider: ^6.1.2
  connectivity_plus: ^6.1.3
  shared_preferences: ^2.5.2
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.1
  file_picker: ^9.2.3
  http: ^1.3.0   # Upgraded http version
  # open_file: ^3.5.10
  path_provider: ^2.1.5
  pdfx: ^2.8.0
  flutter_document_reader_api: ^7.5.1093
  permission_handler: ^11.3.0
  share_plus: 10.1.4
  pdf_text: ^0.5.0
  flutter_pdf_text: ^0.9.0
  syncfusion_flutter_pdf: ^29.1.33
  flutter_colorpicker: ^1.1.0
  stability_image_generation: ^0.0.4
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  flutter_local_notifications: ^19.2.0
  flutter_localization: ^0.3.2
  dio: ^5.9.0
  googleapis: ^15.0.0
  googleapis_auth: ^2.0.0
  android_intent_plus: ^6.0.0
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  photo_view: ^0.15.0
  gallery_saver_plus: ^3.2.9
  lottie: ^3.3.0
  web_socket_channel: ^3.0.3
  tutorial_coach_mark: ^1.2.5
  video_player: ^2.10.1
  device_info_plus: ^10.1.2
  file_saver: ^0.2.0 
  path: ^1.9.0
  
  

dependency_overrides:
  http: ^1.3.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo2.png"
  
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/images/
    - assets/lottie/
    - assets/
    - assets/lottie/font.json
    - assets/lottie/translate.json
    - assets/lottie/filetoimage.json
    - assets/lottie/login.json
    - assets/lottie/signup.json
    - assets/fonts/TimesNewRoman.ttf
    - assets/fonts/Calibri.ttf
    - assets/fonts/Arial.ttf
    - assets/fonts/Serif.ttf
    - assets/fonts/Sans-serif.ttf
    - assets/fonts/Script.ttf
  fonts:
    - family: Arial
      fonts:
        - asset: assets/fonts/Arial.ttf
    - family: Calibri
      fonts:
        - asset: assets/fonts/Calibri.ttf
    - family: TimesNewRoman
      fonts:
        - asset: assets/fonts/TimesNewRoman.ttf
    - family: Serif
      fonts:
        - asset: assets/fonts/Serif.ttf
    - family: SansSerif
      fonts:
        - asset: assets/fonts/Sans-serif.otf
    - family: Script
      fonts:
        - asset: assets/fonts/Script.ttf
  
